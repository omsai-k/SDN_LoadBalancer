version: '3'
services:
  core:
    build:
      context: ..
      dockerfile: simulation/Dockerfile
    command: python src/core/controller.py
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  aggregation:
    build:
      context: ..
      dockerfile: simulation/Dockerfile
    command: python src/aggregation/controller.py http://core:5000
    ports:
      - "5001:5000"
    depends_on:
      - core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  edge:
    build:
      context: ..
      dockerfile: simulation/Dockerfile
    command: python src/edge/controller.py http://aggregation:5000
    ports:
      - "5002:5000"
    depends_on:
      - aggregation
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
